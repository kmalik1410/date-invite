<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Invitation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #ffe6e6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            overflow: hidden;
        }
        .container {
            background-color: white;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            max-width: 90%;
            width: 360px;
            z-index: 10;
        }
        h1 {
            color: #ff4d6d;
            font-size: 24px;
            margin-bottom: 10px;
        }
        p {
            color: #4f5d75;
            font-size: 16px;
            margin-bottom: 25px;
        }
        .emoji-avatar {
            font-size: 70px;
            margin-bottom: 20px;
            display: inline-block;
            animation: pulse 1.5s infinite ease-in-out;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 40px; 
            margin-top: 25px;
            height: 50px;
            position: relative;
        }
        button {
            padding: 12px 25px;
            font-size: 16px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
        }
        #yesBtn {
            background-color: #ff4d6d;
            color: white;
        }
        #noBtn {
            background-color: #6c757d;
            color: white;
            transition: all 0.1s ease;
        }
        /* Date Selector Styles */
        .planner-form {
            display: none;
            text-align: left;
            margin-top: 10px;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        .planner-form h2 {
            color: #ff4d6d;
            font-size: 20px;
            text-align: center;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-size: 14px;
            color: #4f5d75;
            margin-bottom: 5px;
            font-weight: 600;
        }
        select, input {
            width: 100%;
            padding: 10px;
            border: 2px solid #ffa6b6;
            border-radius: 10px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }
        select:focus, input:focus {
            border-color: #ff4d6d;
        }
        .submit-btn {
            width: 100%;
            background-color: #ff4d6d;
            color: white;
            padding: 12px;
            border-radius: 25px;
            font-weight: bold;
            margin-top: 15px;
            border: none;
            cursor: pointer;
        }
        /* Summary Box for Results */
        .summary-box {
            background-color: #fff0f2;
            padding: 15px;
            border-radius: 12px;
            border: 1px dashed #ff4d6d;
            margin: 15px 0;
            font-size: 14px;
            color: #4f5d75;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="inviteStage">
            <div class="emoji-avatar">💗</div>
            <h1 id="question">Will you go on a virtual date with me? ☕✨</h1>
            <p id="details">Let's set up something fun!</p>
            
            <div class="btn-group">
                <button id="yesBtn" onclick="celebrate()">Yes! 🥰</button>
                <button id="noBtn" onmouseover="moveButton()" onclick="moveButton()">No 😢</button>
            </div>
        </div>

        <!-- Hidden Planner Form -->
        <div class="planner-form" id="plannerForm">
            <h2>Let's Plan Our Date! 🎉❤️</h2>
            
            <div class="form-group">
                <label for="dateType">What kind of date sounds best?</label>
                <select id="dateType">
                    <option value="Virtual Coffee Chat ☕">☕ Virtual Coffee Chat</option>
                    <option value="Co-watching a Movie 🎬">🎬 Co-watching a Movie</option>
                    <option value="Playing Online Games  \%)$.">🎮 Playing Online Games</option>
                    <option value="Surprise Me! 🎁">🎁 Surprise Me!</option>
                </select>
            </div>

            <div class="form-group">
                <label for="dateDay">Preferred Day</label>
                <select id="dateDay">
                    <option value="Friday Night">Friday Night</option>
                    <option value="Saturday">Saturday</option>
                    <option value="Sunday">Sunday</option>
                    <option value="A Weekday Evening">A Weekday Evening</option>
                </select>
            </div>

            <div class="form-group">
                <label for="dateTime">Preferred Time / Notes</label>
                <input type="text" id="dateTime" placeholder="e.g., around 7 PM, anytime after work">
            </div>

            <button class="submit-btn" onclick="submitPreferences()">Lock it in! 🔒</button>
        </div>
    </div>

    <script>
        function moveButton() {
            const noBtn = document.getElementById('noBtn');
            noBtn.style.position = 'fixed';
            
            const maxX = window.innerWidth - noBtn.offsetWidth - 40;
            const maxY = window.innerHeight - noBtn.offsetHeight - 40;
            
            const randomX = Math.max(20, Math.floor(Math.random() * maxX));
            const randomY = Math.max(20, Math.floor(Math.random() * maxY));
            
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        function celebrate() {
            document.getElementById('inviteStage').style.display = 'none';
            
            const form = document.getElementById('plannerForm');
            form.style.display = 'block';
            setTimeout(() => { form.style.opacity = '1'; }, 50);
            
            for (let i = 0; i < 25; i++) {
                setTimeout(createHeart, i * 100);
            }
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.innerText = '❤️';
            heart.style.position = 'fixed';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.top = '-5vh';
            heart.style.fontSize = Math.random() * 20 + 15 + 'px';
            heart.style.transform = `rotate(${Math.random() * 360}deg)`;
            heart.style.pointerEvents = 'none';
            heart.style.zIndex = '999';
            heart.style.transition = 'transform 3s linear, top 3s linear';
            
            document.body.appendChild(heart);
            
            setTimeout(() => {
                heart.style.top = '105vh';
                heart.style.transform = `rotate(${Math.random() * 360}deg) translateY(100px)`;
            }, 50);
            
            setTimeout(() => { heart.remove(); }, 3000);
        }

        function submitPreferences() {
            const type = document.getElementById('dateType').value;
            const day = document.getElementById('dateDay').value;
            const time = document.getElementById('dateTime').value || "Anytime!";
            
            const messageText = `I filled out the date invite form 🥰\n\n✨ Activity: ${type}\n📅 Day: ${day}\n⏰ Time/Notes: ${time}\n\nIt's a date! ❤️`;
            
            const container = document.getElementById('plannerForm');
            container.innerHTML = `
                <div style="text-align: center;">
                    <h2 style="margin-bottom: 10px;">Perfect! It's Booked! 🥰</h2>
                    <p style="color: #4f5d75; font-size: 14px;">Tap the button below to copy your selections, then paste them back into our text chat!</p>
                    
                    <div class="summary-box" id="textToCopy">${messageText.replace(/\n/g, '<br>')}</div>
                    
                    <button class="submit-btn" id="copyBtn" onclick="copyToClipboard('${btoa(unescape(encodeURIComponent(messageText)))}')">Copy Details 📋</button>
                    <p id="copyAlert" style="color: #ff4d6d; font-size: 13px; margin-top: 10px; font-weight: bold; display: none;">Copied! Ready to paste into our chat thread. 💌</p>
                </div>
            `;
        }

        function copyToClipboard(base64Str) {
            const decodedText = decodeURIComponent(escape(atob(base64Str)));
            navigator.clipboard.writeText(decodedText).then(() => {
                const alertText = document.getElementById('copyAlert');
                const btn = document.getElementById('copyBtn');
                alertText.style.display = 'block';
                btn.innerText = 'Copied! ✅';
                btn.style.backgroundColor = '#4abc96';
            }).catch(err => {
                alert('Oops, copying failed! You can manually copy the text inside the box.');
            });
        }
    </script>
</body>
</html>
